<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aligned Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .calculator {
        width: 320px;
        padding: 20px;
        background: #1f2933;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .display {
        width: 100%;
        height: 70px;
        background: #eef0f3;
        color: #030b09;
        font-size: 30px;
        padding: 15px;
        text-align: right;
        border-radius: 10px;
        margin-bottom: 15px;
        overflow-x: auto;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        height: 55px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        transition: 0.15s ease;
    }

    button:active {
        transform: scale(0.95);
    }

    .num {
        background: #374151;
        color: #fff;
    }

    .num:hover {
        background: #4b5563;
    }

    .op {
        background: #f59e0b;
        color: #000;
        font-weight: bold;
    }

    .op:hover {
        background: #fbbf24;
    }

    .clear {
        background: #ef4444;
        color: #fff;
        font-weight: bold;
    }

    .equal {
        background: #3a0f84;
        color: #000;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
        <!-- Row 1 -->
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="op" onclick="append('/')">÷</button>
        <button class="op" onclick="append('*')">×</button>
        <button class="op" onclick="append('-')">−</button>

        <!-- Row 2 -->
        <button class="num" onclick="append('7')">7</button>
        <button class="num" onclick="append('8')">8</button>
        <button class="num" onclick="append('9')">9</button>
        <button class="op" onclick="append('+')">+</button>

        <!-- Row 3 -->
        <button class="num" onclick="append('4')">4</button>
        <button class="num" onclick="append('5')">5</button>
        <button class="num" onclick="append('6')">6</button>
        <button class="equal" onclick="calculate()">=</button>

        <!-- Row 4 -->
        <button class="num" onclick="append('1')">1</button>
        <button class="num" onclick="append('2')">2</button>
        <button class="num" onclick="append('3')">3</button>
        <button class="num" onclick="append('.')">.</button>

        <!-- Row 5 -->
        <button class="num" onclick="append('0')" style="grid-column: span 4;">0</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    function append(value) {
        if (display.innerText === "0") {
            display.innerText = value;
        } else {
            display.innerText += value;
        }
    }

    function clearDisplay() {
        display.innerText = "0";
    }

    function calculate() {
        try {
            display.innerText = eval(display.innerText);
        } catch {
            display.innerText = "Error";
        }
    }
</script>

</body>
</html>
